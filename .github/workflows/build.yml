name: build

# Build the Windows release and attach the installer to a GitHub Release when a
# version tag (vX.Y.Z) is pushed. Can also be run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Release notes: lift this version's section out of both changelogs so the published
      # release shows what actually changed. Falls back to the fixed line below when there is
      # no tag (manual run) or the version has no changelog section yet.
      - name: Compose release notes
        id: notes
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          function Get-ChangelogSection([string]$Path, [string]$Version) {
            if (-not (Test-Path $Path)) { return '' }
            $text = Get-Content -Path $Path -Raw
            $escaped = [regex]::Escape($Version)
            # "## [1.2.3] - date" heading, everything up to the next "## [" heading.
            $match = [regex]::Match($text, "(?ms)^## \[$escaped\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
            if ($match.Success) { return $match.Groups[1].Value.Trim() }
            return ''
          }
          $ko = Get-ChangelogSection -Path 'CHANGELOG.md' -Version $version
          $en = Get-ChangelogSection -Path 'CHANGELOG.en.md' -Version $version
          $sections = @()
          if ($ko) { $sections += "## 변경 요약`n`n$ko`n`n전체 변경 이력: [CHANGELOG.md]($env:REPO_URL/blob/main/CHANGELOG.md)" }
          if ($en) { $sections += "## What's Changed`n`n$en`n`nFull changelog: [CHANGELOG.en.md]($env:REPO_URL/blob/main/CHANGELOG.en.md)" }
          if ($sections.Count -eq 0) {
            Write-Host "::warning::No changelog section found for $version; keeping the default release body."
            exit 0
          }
          $sections += "## 설치 / Install`n`n``SessionMeter_${version}_x64-setup.exe`` (Windows x64). 기존 설치본은 앱의 업데이트 알림에서 갱신할 수 있습니다."
          $body = $sections -join "`n`n"
          $delimiter = "NOTES_$([guid]::NewGuid().ToString('N'))"
          # Add-Content (not Out-File) so no console-width wrapping can corrupt a long line.
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Value "notes<<$delimiter`n$body`n$delimiter"

      - name: Build app + installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: add these repository secrets from `tauri signer generate`.
          # The updater manifest (latest.json) + .sig are produced only when the private
          # key is present (with createUpdaterArtifacts: true in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "SessionMeter ${{ github.ref_name }}"
          # Publish as a PRERELEASE (not a draft), then promote it manually to ship the update.
          # Why not a draft: a draft has no real git tag, and publishing it can leave the release
          # detached from the version tag (an "untagged-<hash>" slug), which breaks the updater's
          # installer URL (releases/download/vX.Y.Z/...setup.exe -> 404). A prerelease is created
          # already tagged, so the assets are always reachable.
          # Gate: the updater's `releases/latest` endpoint ignores prereleases, so installed apps
          # do NOT see it yet. To ship to users, edit the release on GitHub and uncheck
          # "Set as a pre-release" (promote to Latest) — the tag stays intact.
          releaseDraft: false
          prerelease: true
          releaseBody: ${{ steps.notes.outputs.notes || 'See the changelog for details.' }}
